services:
  airflow:
    build: .
    image: airflow-project:3.1.7
    container_name: airflow-web
    command: standalone
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__API_AUTH__JWT_SECRET: "${AIRFLOW_JWT_SECRET:?Jalankan bash scripts/init-env.sh terlebih dahulu}"
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__AUTH_MANAGER: airflow.api_fastapi.auth.managers.simple.simple_auth_manager.SimpleAuthManager
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: "admin:admin"
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: "http://localhost:8080/execution/"
      AIRFLOW_CONN_FTP_EBSP: "ftp://airflow:airflow@ftp:21"
      AIRFLOW_CONN_FTP_MII: "ftp://airflow:airflow@ftp:21"
      # SFTP_MTI, SFTP_EBSP, SFTP_PWC_POST dikelola di metadata/UI Airflow.
      LOCAL_SFTP_USERNAME: "airflow"
      LOCAL_SFTP_PASSWORD: "airflow"
      # Database transaksi Way4 yang diakses oleh Connection4WAY.py.
      AIRFLOW_CONN_DB_REKON_UAT: "postgresql://airflow:airflow@postgres:5432/db_rekon_uat"
      AIRFLOW_CONN_DB_REKON_PWC: '{"conn_type":"oracle","host":"oracle","port":1521,"login":"POWERCARD","password":"powercard","extra":{"service_name":"FREEPDB1"}}'
      POSTINGFILE_S3_BUCKET: postingfile
      POSTINGFILE_S3_CONNECTION: local_s3
      AIRFLOW_CONN_LOCAL_S3: '{"conn_type":"aws","login":"localposting","password":"localposting-dev-secret","extra":{"endpoint_url":"http://s3-local:9000","region_name":"us-east-1","config_kwargs":{"s3":{"addressing_style":"path"}}}}'
      PYTHONPATH: "/opt/airflow:/opt/airflow/dags:/opt/airflow/runtime-compat:/opt/airflow/runtime"
    ports:
      - "8080:8080"
    volumes:
      # Gunakan metadata yang sama setelah backup dan migrasi.
      - airflow2-data:/opt/airflow
      - ./dags:/opt/airflow/dags:ro
      - ./data:/opt/airflow/project-data
      - ./dags:/data/airflow/nfs/dags:ro
      - ./data/artifacts:/data/airflow/nfs/artifacts
      - ./airflow_runtime:/opt/airflow/runtime:ro
      - ./airflow_runtime_compat:/opt/airflow/runtime-compat:ro
    depends_on:
      - ftp
      - sftp-pwc
      - postgres
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  s3-local:
    image: rustfs/rustfs@sha256:1803faef57627e2d9c2e7d89d655d712ddded5389040054987163043fecb6a3c
    container_name: airflow-s3-local
    command: ["/data"]
    environment:
      RUSTFS_ACCESS_KEY: localposting
      RUSTFS_SECRET_KEY: localposting-dev-secret
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - s3-local-data:/data

  s3-init:
    image: airflow-project:3.1.7
    depends_on:
      - s3-local
    entrypoint: ["python", "/scripts/init.py"]
    environment:
      S3_ENDPOINT_URL: http://s3-local:9000
      AWS_ACCESS_KEY_ID: localposting
      AWS_SECRET_ACCESS_KEY: localposting-dev-secret
    volumes:
      - ./scripts/local-s3:/scripts:ro

  ftp:
    image: fauria/vsftpd
    container_name: airflow-ftp
    environment:
      FTP_USER: airflow
      FTP_PASS: airflow
      PASV_ADDRESS: ftp
      PASV_ADDR_RESOLVE: "YES"
      PASV_MIN_PORT: 21100
      PASV_MAX_PORT: 21110
    volumes:
      # Konfigurasi lama (typo): source dipasang ke folder MII, sedangkan DAG
      # membaca /ACQ/MTI/ClearingRintisQRIS/ sehingga file tidak terunduh.
      # - ./data/ACQ_MTI:/home/vsftpd/airflow/ACQ/MII:ro
      # Keterangan: samakan mount dengan source_path MTI pada PostFile_QRRecon.py.
      - ./data/ACQ_MTI:/home/vsftpd/airflow/ACQ/MTI:ro
      - ./data/ftp-destination/sftpdata:/home/vsftpd/airflow/sftpdata

  sftp-pwc:
    image: atmoz/sftp:alpine
    container_name: airflow-sftp-pwc
    # Konfigurasi lama dipertahankan; UID 1001 tidak dapat menulis bind mount lokal.
    # command: airflow:airflow:1001
    # Keterangan: UID 1000 disamakan dengan pemilik data/sftp-pwc di host.
    command: airflow:airflow:1000
    volumes:
      # Keterangan: lokasi penyimpanan file hasil kirim SFTP PWC di lingkungan lokal.
      - ./data/sftp-pwc:/home/airflow/upload
      # Keterangan: user SFTP berada dalam chroot /home/airflow, sehingga target
      # /pwrcard/home/usr/data dipasang di bawah home user agar terlihat via SFTP.
      - ./data/pwrcard:/home/airflow/pwrcard
      - ./data/ftp-destination/sftpdata:/home/airflow/sftpdata

  oracle:
    image: gvenzl/oracle-free:23-slim
    container_name: airflow-oracle
    environment:
      ORACLE_PASSWORD: oracle
      APP_USER: POWERCARD
      APP_USER_PASSWORD: powercard
    ports:
      - "1521:1521"
    volumes:
      - oracle-data:/opt/oracle/oradata
      - ./oracle/init:/container-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  postgres:
    image: postgres:16-alpine
    container_name: airflow-postgres
    environment:
      POSTGRES_DB: db_rekon_uat
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
    ports:
      # Konfigurasi lama: port 5432 gagal bind karena sudah dipakai host.
      # - "5432:5432"
      # Keterangan: hanya port host dipindah; antar-container tetap memakai 5432.
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d db_rekon_uat"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  s3-local-data:
  airflow-data:
  airflow2-data:
  oracle-data:
  postgres-data:
